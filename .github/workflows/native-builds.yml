name: native-builds

# macOS (.dmg) and iOS (.ipa) built on GitHub's free macOS runners.
# No Mac and no Apple Developer account are required for UNSIGNED artifacts.
# Run on demand: Actions tab -> native-builds -> Run workflow.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  macos:
    name: macOS .dmg (unsigned)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: npm ci
      - name: Build universal .app + .dmg
        run: npx tauri build --target universal-apple-darwin
      - name: Collect artifacts
        run: |
          set -e
          mkdir -p out
          find src-tauri/target/universal-apple-darwin/release/bundle -name '*.dmg' -exec cp {} out/ \;
          APP=$(find src-tauri/target/universal-apple-darwin/release/bundle -maxdepth 3 -name '*.app' | head -1)
          if [ -n "$APP" ]; then ditto -c -k --sequesterRsrc --keepParent "$APP" out/Shotlist.app.zip; fi
          ls -lh out
      - uses: actions/upload-artifact@v4
        with:
          name: Shotlist-macos-unsigned
          path: out/*

  ios:
    name: iOS .ipa (unsigned, sideload)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - run: npm ci

      # The Xcode "Build Rust Code" phase needs the OUTER Tauri CLI running
      # (it reads .tauri/cli-options-server.json), so we build through the CLI
      # rather than calling xcodebuild directly.
      - name: Build iOS app
        run: |
          set -e
          npx tauri ios init
          npx tauri ios build --target aarch64 --no-sign || npx tauri ios build --target aarch64
          echo "--- where did it land? ---"
          find src-tauri/gen/apple/build src-tauri/target -maxdepth 6 -name '*.app' 2>/dev/null || true

      - name: Package .ipa
        run: |
          set -e
          APP=$(find src-tauri/gen/apple/build src-tauri/target -maxdepth 6 -name '*.app' 2>/dev/null | head -1)
          if [ -z "$APP" ]; then echo "no .app found — see the listing above"; exit 1; fi
          echo "app=$APP"
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out && zip -qry Shotlist-unsigned.ipa Payload && ls -lh Shotlist-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Shotlist-ios-unsigned
          path: out/Shotlist-unsigned.ipa
