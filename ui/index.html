<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Shotlist</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #f5f3ee; color: #191817;
      font-family: Inter, -apple-system, "Segoe UI", system-ui, sans-serif;
      padding: 24px; text-align: center;
    }
    .mark { width: 44px; height: 44px; margin: 0 auto 18px; }
    h1 { font-family: Georgia, "Times New Roman", serif; font-size: 34px; letter-spacing: -0.02em; margin: 0 0 6px; font-weight: 400; }
    p { margin: 0 0 18px; color: #6b665d; font-size: 14px; }
    .mono { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-size: 10.5px; letter-spacing: .11em; text-transform: uppercase; color: #8e887d; }
    button {
      height: 36px; padding: 0 16px; border-radius: 4px; border: 1px solid #191817;
      background: #191817; color: #fbfaf6; font: inherit; font-size: 13px; cursor: pointer;
    }
    button.ghost { background: transparent; color: #191817; border-color: #d2ccc0; margin-left: 6px; }
    .spinner {
      width: 16px; height: 16px; border: 1.5px solid #191817; border-right-color: transparent;
      border-radius: 50%; display: inline-block; vertical-align: -3px; margin-right: 8px;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div>
    <svg class="mark" viewBox="0 0 24 24" fill="none" stroke="#191817" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
      <path d="M3 8.5 20.2 4.2l.9 3.6L3.9 12.1z" />
      <path d="M4 12h16v6.5a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 18.5z" />
      <path d="m7.4 6 1.3 3M12.2 4.9l1.3 3M17 3.8l1.3 3" />
    </svg>
    <h1>Shotlist</h1>
    <p id="status"><span class="spinner"></span>Connecting to your workspace…</p>
    <button onclick="go()">Retry</button>
    <button class="ghost" onclick="window.open(window.SHOTLIST_URL, '_blank')">Open in browser</button>
    <p class="mono" style="margin-top:22px" id="host"></p>
  </div>
  <script src="config.js"></script>
  <script>
    const statusEl = document.getElementById('status');
    document.getElementById('host').textContent = String(window.SHOTLIST_URL || '').replace(/^https?:\/\//, '');

    function go() {
      const url = window.SHOTLIST_URL;
      if (!url) return;
      statusEl.innerHTML = '<span class="spinner"></span>Connecting to your workspace…';
      location.replace(url);
    }

    // If we are still on this page after 9 seconds, the server did not answer.
    setTimeout(() => {
      if (document.visibilityState === 'visible') {
        statusEl.textContent = 'Cannot reach the server. Check your connection, then retry.';
      }
    }, 9000);

    go();
  </script>
</body>
</html>
