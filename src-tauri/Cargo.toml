[package]
name = "shotlist-shell"
version = "1.0.1"
description = "Native shell for the Shotlist server"
authors = ["Shotlist"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "shotlist_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
